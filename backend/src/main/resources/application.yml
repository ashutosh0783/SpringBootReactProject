server:
  port: 8080

spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:incident_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:incident_user}
    password: ${DB_PASSWORD:incident_pass}
  jpa:
    hibernate:
      # The table is created by database/init/01-schema.sql; "update" only adds anything missing.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    try-it-out-enabled: true
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
