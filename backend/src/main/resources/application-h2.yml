# In-memory H2 database: no MySQL or Docker needed.
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data is reset on every restart.
spring:
  datasource:
    url: jdbc:h2:mem:incident_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Run data-h2.sql after Hibernate has created the table
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      platform: h2
  h2:
    console:
      enabled: true
      path: /h2-console
