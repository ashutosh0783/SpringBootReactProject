services:
  mysql:
    image: mysql:8.4
    container_name: incident-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: incident_management
      MYSQL_USER: incident_user
      MYSQL_PASSWORD: incident_pass
      TZ: UTC
    ports:
      # Host port 3307 avoids clashing with a locally installed MySQL on 3306
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
